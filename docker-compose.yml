services:
  # Redis service for Celery broker and result backend
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Celery worker service
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - DISCORD_VOICE_CHANNEL_ID=${DISCORD_VOICE_CHANNEL_ID:-1344939398197805133}
      - DISCORD_TEXT_CHANNEL_ID=${DISCORD_TEXT_CHANNEL_ID:-1344939398197805133}
      - DISCORD_CHANNEL_ID=${DISCORD_CHANNEL_ID}
      - DISCORD_CODING_CALENDAR_CHANNEL_ID=${DISCORD_CODING_CALENDAR_CHANNEL_ID}
      - DISCORD_SERENDIPITY_CALENDAR_CHANNEL_ID=${DISCORD_SERENDIPITY_CALENDAR_CHANNEL_ID}
      - DISCORD_DMS_CHANNEL_ID=${DISCORD_DMS_CHANNEL_ID}
    volumes:
      - ./recordings:/app/recordings
      - ./DB:/app/DB
    command: celery -A HMBeat worker --loglevel=info --concurrency=1 -Q discord_bot

  # Celery Beat service for scheduling tasks
  beat:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    command: celery -A HMBeat beat --loglevel=info

  # Flower service for monitoring Celery tasks (optional)
  flower:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    ports:
      - "5555:5555"
    command: python -m flower -A HMBeat --port=5555 --broker=redis://redis:6379/0

volumes:
  redis_data:
