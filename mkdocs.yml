    - icon: fontawesome/brands/x-twitter
      link: https://x.com/trademanv1?s=21&t=bBTay4-vvjkbqF5YnSYrog
    - icon: fontawesome/brands/instagram
      link: https://www.instagram.com/trademan.v1?igsh=NnZ6dDR2M2Nhc3h5
    - icon: fontawesome/solid/envelope
      link: mailto:your-email@example.com # Replace with your actual email

