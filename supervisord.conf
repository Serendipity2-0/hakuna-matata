[supervisord]
nodaemon=true
user=app_user
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:frontend]
directory=/app/frontend
command=npm run dev -- -H 0.0.0.0 -p 8052
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=NODE_ENV="development"
user=app_user

[program:backend]
directory=/app/backend
command=uvicorn app.main:app --host 0.0.0.0 --port 8051 --reload
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
user=app_user
environment=DATABASE_URL="sqlite:///rbac_system.db",SECRET_KEY="your-secret-key-here"
