name: Docker CI/CD

on:
  push:
    branches:
      - 42-endpoint-for-endpoint-list

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Check out the code
        uses: actions/checkout@v3

      - name: Create environment file
        run: |
          echo "DATABASE_URL=sqlite:///rbac_system.db" > kaas.env
          echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" >> kaas.env

      - name: Stop and Remove Old Container
        run: |
          # Stop and remove only our container
          docker stop rbac-container || true
          docker rm rbac-container || true
          
          # Remove only untagged/dangling images related to our app
          docker images "rbac-app" -q | xargs -r docker rmi
          docker images --filter "dangling=true" -q | xargs -r docker rmi

      - name: Build Docker image
        run: |
          docker build \
            --no-cache \
            -t rbac-app:latest \
            .

      - name: Run Docker container
        run: |
          docker run -d \
            --name rbac-container \
            -p 8052:8052 \
            -p 8051:8051 \
            --restart unless-stopped \
            rbac-app:latest

      - name: Check container health
        run: |
          sleep 10
          docker ps | grep rbac-container
          docker logs rbac-container --tail 50
